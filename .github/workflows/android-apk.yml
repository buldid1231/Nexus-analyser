name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build APKs
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Verify APKs exist
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Prepare installable debug and aligned release APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NexusSkyrimRadar-v0.17-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            NexusSkyrimRadar-v0.17-aligned-unsigned.apk

      - name: Include local release signing tool
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/

      - name: Upload APK build files
        uses: actions/upload-artifact@v4
        with:
          name: NexusSkyrimRadar-v0.17-apk-build
          path: |
            NexusSkyrimRadar-v0.17-debug.apk
            NexusSkyrimRadar-v0.17-aligned-unsigned.apk
            signing-tools/
          if-no-files-found: error
          retention-days: 30
